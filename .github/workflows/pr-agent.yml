name: Shared PR Agent

on:
  workflow_call:
    inputs:
      evidence_title:
        description: Heading used when the shared core must emit advisory fallback evidence.
        required: true
        type: string
    secrets:
      NVIDIA_API_KEY:
        required: true

permissions:
  actions: read
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: pr-agent-${{ github.repository }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.sender.type != 'Bot' &&
      github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      review_command: ${{ steps.review-stamp.outputs.review_command }}

    steps:
      - name: Checkout trusted caller policy
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false

      - name: Require caller-local PR-Agent contract
        shell: bash
        run: |
          test -f scripts/select-pr-agent-skills.mjs
          test -f scripts/pr-agent/build-evidence.mjs
          test -f scripts/pr-agent/review-policy.mjs
          test -f package-lock.json

      - name: Read changed filenames
        id: changed-files
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ github.token }}
          script: |
            const fs = require("fs");
            const repo = { owner: context.repo.owner, repo: context.repo.repo };
            const pull_number = context.payload.pull_request.number;
            const expectedBase = context.payload.pull_request.base.sha;
            const expectedHead = context.payload.pull_request.head.sha;
            const snapshot = async (stage) => {
              const { data: pr } = await github.rest.pulls.get({ ...repo, pull_number });
              if (pr.base.sha !== expectedBase || pr.head.sha !== expectedHead) {
                throw new Error(`PR_SCOPE_CHANGED: ${stage} manifest: base/head no longer match the workflow event`);
              }
              if (!Number.isSafeInteger(pr.changed_files) || pr.changed_files < 1 || pr.changed_files >= 3000) {
                throw new Error(`PR_SCOPE_UNAVAILABLE: ${stage} changed_files=${pr.changed_files}; GitHub lists at most 3000 files`);
              }
              return pr.changed_files;
            };
            // The GitHub PR file API is the canonical full-diff inventory, not the
            // historical commit list selected by upstream incremental review.
            const expectedCount = await snapshot("before");
            const files = await github.paginate(github.rest.pulls.listFiles, {
              ...repo, pull_number, per_page: 100,
            });
            if (files.length !== expectedCount) {
              throw new Error(`PR_SCOPE_INCOMPLETE: GitHub returned ${files.length}/${expectedCount} current PR files`);
            }
            const changedFiles = [];
            const seen = new Set();
            for (const file of files) {
              if (typeof file.filename !== "string" || !file.filename || seen.has(file.filename)) {
                throw new Error(`PR_SCOPE_AMBIGUOUS: missing or duplicate current PR filename: ${file.filename}`);
              }
              if (file.status === "renamed" &&
                  (typeof file.previous_filename !== "string" || !file.previous_filename ||
                   file.previous_filename === file.filename)) {
                throw new Error(`PR_SCOPE_AMBIGUOUS: renamed file lacks a distinct previous_filename: ${file.filename}`);
              }
              seen.add(file.filename);
              changedFiles.push(file.filename);
            }
            // Prevent PR pushes/rebases while paginating from producing a stale
            // but apparently complete manifest. Verify metadata twice.
            const afterCount = await snapshot("after");
            if (afterCount !== expectedCount) {
              throw new Error(`PR_SCOPE_CHANGED: changed_files moved from ${expectedCount} to ${afterCount}`);
            }
            fs.mkdirSync(`${process.env.GITHUB_WORKSPACE}/.pr-agent`, { recursive: true });
            fs.writeFileSync(
              `${process.env.GITHUB_WORKSPACE}/.pr-agent/changed-files.json`,
              JSON.stringify(changedFiles),
              "utf8",
            );
            core.info(`PR_SCOPE_VERIFIED: ${changedFiles.length} current PR files for ${expectedBase.slice(0, 12)}..${expectedHead.slice(0, 12)}`);
            core.setOutput("files", JSON.stringify(changedFiles));

      - name: Checkout PR head lockfile as untrusted data
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: .pr-agent-head
          sparse-checkout: package-lock.json
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Build trusted PR-Agent evidence
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVIDENCE_TITLE: ${{ inputs.evidence_title }}
        run: |
          mkdir -p .pr-agent
          if [[ ! -s .pr-agent-head/package-lock.json ]]; then
            printf '# %s\n\nVersion evidence: **NEEDS VERIFICATION**\nAPI claim default: **NEEDS VERIFICATION**\nBase SHA: `%s`\nHead SHA: `%s`\n\nPR head package-lock.json missing or empty; framework/API claims are advisory only.\n' \
              "$EVIDENCE_TITLE" "$BASE_SHA" "$HEAD_SHA" > .pr-agent/evidence.md
          elif ! node scripts/pr-agent/build-evidence.mjs \
            --base-lock package-lock.json \
            --head-lock .pr-agent-head/package-lock.json \
            --base-sha "$BASE_SHA" \
            --head-sha "$HEAD_SHA" \
            --changed-files-file .pr-agent/changed-files.json \
            --output .pr-agent/evidence.md; then
            printf '# %s\n\nVersion evidence: **NEEDS VERIFICATION**\nAPI claim default: **NEEDS VERIFICATION**\nBase SHA: `%s`\nHead SHA: `%s`\n\nEvidence generation failed; framework/API claims are advisory only.\n' \
              "$EVIDENCE_TITLE" "$BASE_SHA" "$HEAD_SHA" > .pr-agent/evidence.md
          fi
          test -s .pr-agent/evidence.md
          grep -Fq "Base SHA: \`$BASE_SHA\`" .pr-agent/evidence.md
          grep -Fq "Head SHA: \`$HEAD_SHA\`" .pr-agent/evidence.md

      # SAN-1628: The caller's trusted *base* policy can lag a PR that fixes
      # incremental scope. Enforce full current-PR review in this canonical
      # shared runtime for both opened and synchronize events. No comment-history
      # API call is needed; SAN-1415 can explicitly restore safe incremental mode.
      - name: Select full PR review
        id: review-mode
        shell: bash
        run: |
          echo 'PR-Agent review command: /review'
          echo 'review_command=/review' >> "$GITHUB_OUTPUT"
          echo 'push_commands=["/review"]' >> "$GITHUB_OUTPUT"

      - name: Select trusted caller review skills
        id: reviewer-skills
        shell: bash
        env:
          CHANGED_FILES_FILE: .pr-agent/changed-files.json
          CHANGED_FILES_JSON: ${{ steps.changed-files.outputs.files }}
        run: node scripts/select-pr-agent-skills.mjs >> "$GITHUB_OUTPUT"

      - name: Record review publication boundary
        id: review-start
        shell: bash
        run: echo "epoch_ms=$(($(date +%s) * 1000))" >> "$GITHUB_OUTPUT"

      - name: Review pull request
        uses: docker://pragent/pr-agent@sha256:b1ed6e8de56eb4d6e4169ee0d5c209bb5ed1ef071a01c0c042c64b80192a785c # v0.49.0-github_action
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ARTIFACT_PATH: ".pr-agent/evidence.md"
          ARTIFACT_INSTRUCTIONS: "Use this trusted artifact as exact-version evidence, not standalone API proof. A framework/API claim is VERIFIED only when trusted diff/repository/skill/type evidence also proves the behavior; otherwise keep it NEEDS VERIFICATION, advisory, and non-blocking."
          # Use LiteLLM OpenAI adapter for NVIDIA Build: it honours max_retries=0.
          OPENAI_API_BASE: "https://integrate.api.nvidia.com/v1"
          OPENAI_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          config.model: "openai/nvidia/nemotron-3.5-lightning-30b-a3b"
          config.fallback_models: '["openai/nvidia/nemotron-3.5-super-vl-120b-a12b"]'
          # Real MDE PR #342 still logged "total tokens over limit: 32000":
          # custom_model_max_tokens only supplies unknown-model metadata, while
          # max_model_tokens is the separate *global* processing ceiling.
          # Canary 40K processing: 32K failed before model I/O because the
          # required prompt plus 16K output reservation left no input capacity.
          # Keep Lightning, Super VL, 16K output, six calls, coverage reporting
          # and exact-head review validation unchanged.
          config.max_model_tokens: "40000"
          config.custom_model_max_tokens: "40000"
          # Split oversized PR diffs into chunks, capped at six AI calls.
          # The review footer identifies any remaining uncovered files.
          pr_reviewer.enable_large_pr_chunking: "true"
          pr_reviewer.enable_review_coverage_footer: "true"
          pr_reviewer.max_number_of_calls: "6"
          # PR-Agent compares the MERGED finding count against this single-call
          # limit; two chunks may legitimately contribute up to six findings each.
          # Permit up to 12 merged findings; 13+ still fails completeness.
          # This host env override takes precedence over MDE main .pr_agent.toml.
          pr_reviewer.num_max_findings: "13"
          # 8K was too small for a feature-sized diff: MDE PR #642 logged
          # "Empty content in model response (finish_reason: length)" at 98 s — the model
          # spent its whole completion budget before writing any review YAML — and the
          # fallback then timed out. Restore 16K so the same strict review can answer.
          config.max_output_tokens: "16384"
          # SAN-1609: NVIDIA's OpenAI-compatible endpoint uses provider-native
          # chat_template_kwargs to disable thinking. config.reasoning_effort
          # alone need not reach these unknown model IDs through LiteLLM; the
          # default thinking budget can exhaust all 16K completion tokens and
          # return empty content (finish_reason=length) with no review YAML.
          # Supported by both pinned NVIDIA models and PR-Agent v0.49.0's
          # LITELLM.EXTRA_BODY path. Keep the same 40K input, 16K output,
          # six-chunk coverage, fallback and exact-head fail-closed verifier.
          litellm.extra_body: '{"chat_template_kwargs":{"enable_thinking":false}}'
          config.reasoning_effort: "none"
          config.additional_reasoning_effort_models: '[]'
          # A ~33K-token diff needs more than 120 s per attempt on this endpoint: MDE PR #642
          # failed twice at exactly 2 x 120 s (primary + fallback) with no findings published,
          # while smaller PRs passed inside the budget. A live large-chunk replay previously
          # needed 143 s. Keep the same strict, fail-closed review and give it real headroom.
          config.ai_timeout: "300"
          config.retry_same_model_on_timeout: "false"
          config.num_retries: "0"
          # Avoid the stalled aiohttp transport observed in the existing PR-Agent incident.
          litellm.disable_aiohttp: "true"
          config.propagate_tool_errors: "true"
          pr_reviewer.publish_error_details: "true"
          skills.enabled: ${{ steps.reviewer-skills.outputs.enabled }}
          skills.paths: ${{ steps.reviewer-skills.outputs.paths }}
          skills.max_skills_tokens: ${{ steps.reviewer-skills.outputs.max_tokens }}
          github_action_config.auto_review: "true"
          github_action_config.auto_describe: "false"
          github_action_config.auto_improve: "false"
          github_action_config.pr_actions: '["opened", "reopened", "ready_for_review"]'
          github_action_config.handle_push_trigger: "true"
          github_action_config.push_commands: ${{ steps.review-mode.outputs.push_commands }}

      - name: Stamp exact review identity
        id: review-stamp
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          REVIEW_COMMAND: ${{ steps.review-mode.outputs.review_command }}
          REVIEW_STARTED_AT: ${{ steps.review-start.outputs.epoch_ms }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        with:
          github-token: ${{ github.token }}
          script: |
            const expectedCommand = process.env.REVIEW_COMMAND || "/review";
            const startedAt = Number(process.env.REVIEW_STARTED_AT);
            const baseSha = process.env.BASE_SHA;
            const headSha = process.env.HEAD_SHA;
            const envelope = (type, command) =>
              `<!-- mde-agent-review:v1 base=${baseSha} head=${headSha} command="${command}" type=${type} -->`;
            const isStandalone = (body) =>
              body.includes("## Standalone PR Review") &&
              body.includes("PR-Agent could not safely update the persistent review") &&
              body.includes("## MDE PR Review");
            const isIncrementalSkip = (body) =>
              body.includes("Incremental Review Skipped") &&
              (body.includes("No files were changed since the previous PR Review") ||
               body.includes("No files were changed since the [previous PR Review]("));
            const commandForBody = (body) => {
              if (body.includes("<!-- pr-agent:review:full -->")) return "/review";
              if (body.includes("<!-- pr-agent:review:incremental -->") || isIncrementalSkip(body)) return "/review -i";
              return null;
            };

            // PR-Agent can switch /review -i to a full /review when it cannot
            // anchor incremental commits. Full reviews with findings record
            // persistent coverage state; clean reviews may omit it (v0.46).
            // In that clean case require PR-Agent's own exact-head header near
            // the top of the fresh bot comment. Never infer coverage from it.
            const fullReviewForCurrentHead = (body) => {
              if (commandForBody(body) !== "/review") return false;
              const markers = [...body.matchAll(/<!-- pr-agent-review-state:v1\s*\n([\s\S]*?)\n-->/g)];
              if (markers.length > 1) return false;
              if (markers.length === 1) {
                try {
                  const state = JSON.parse(markers[0][1]);
                  return state.last_run?.complete === true &&
                    state.last_run?.head_sha?.toLowerCase() === headSha.toLowerCase();
                } catch {
                  return false;
                }
              }
              // A malformed/incomplete state cannot masquerade as a clean review.
              if (body.includes("pr-agent-review-state:v1")) return false;
              const header = body.slice(0, 700);
              const reviewedHead =
                `#### (Review updated until commit https://github.com/${context.repo.owner}/${context.repo.repo}/commit/${headSha})`;
              return header.startsWith("## MDE PR Review") &&
                header.includes("<!-- pr-agent:review:full -->") &&
                header.includes(reviewedHead);
            };
            const publishedCommandFor = (body) => {
              if (isStandalone(body)) return expectedCommand;
              const published = commandForBody(body);
              if (published === expectedCommand) return published;
              if (expectedCommand === "/review -i" && fullReviewForCurrentHead(body)) return "/review";
              return null;
            };

            let candidate = null;
            for (let attempt = 1; attempt <= 3 && !candidate; attempt += 1) {
              const comments = await github.paginate(github.rest.issues.listComments, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                per_page: 100,
              });
              const fresh = comments.filter((comment) =>
                comment.user?.login === "github-actions[bot]" &&
                new Date(comment.updated_at).getTime() >= startedAt &&
                publishedCommandFor(comment.body ?? "") !== null,
              );
              if (fresh.length > 1) {
                core.setFailed(`INVALID_ENVELOPE: ${fresh.length} fresh PR-Agent review results are ambiguous`);
                return;
              }
              candidate = fresh[0] ?? null;
              if (!candidate && attempt < 3) await new Promise((resolve) => setTimeout(resolve, 2000));
            }
            if (!candidate) {
              core.setFailed("NO_REVIEW: PR-Agent completed without a fresh review result to stamp");
              return;
            }

            const original = candidate.body ?? "";
            const type = isStandalone(original) ? "standalone" : "canonical";
            if (!original.trim()) {
              core.setFailed("EMPTY_REVIEW: PR-Agent published an empty review result");
              return;
            }
            const publishedCommand = publishedCommandFor(original);
            if (!publishedCommand) {
              core.setFailed("WRONG_COMMAND: published review cannot be tied to the requested command");
              return;
            }
            const body = `${envelope(type, publishedCommand)}\n${original}`;
            try {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: candidate.id,
                body,
              });
              // The verifier must compare the command actually published, not
              // the incremental command originally requested before fallback.
              core.setOutput("review_command", publishedCommand);
            } catch (error) {
              core.setFailed(`GITHUB_UPDATE_FAILED: ${error.message}`);
            }

  verify-review-result:
    name: verify-review-result
    needs: review
    if: needs.review.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout trusted caller verification policy
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false

      - name: Prepare bounded exact-blob recovery
        id: recovery-plan
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ github.token }}
          script: |
            const fs = require("node:fs");
            const { pathToFileURL } = require("node:url");
            const source = process.env.GITHUB_WORKSPACE + "/scripts/pr-agent/prepare-recovery.mjs";
            if (!fs.existsSync(source)) {
              core.notice("Bounded recovery waits for the trusted base module to merge.");
              return;
            }
            const { prepareRecoveryFromGithub } = await import(pathToFileURL(source).href);
            const { parseReviewEnvelope } = await import(pathToFileURL(
              process.env.GITHUB_WORKSPACE + "/scripts/pr-agent/review-policy.mjs").href);
            const repo = { owner: context.repo.owner, repo: context.repo.repo };
            const pullNumber = context.payload.pull_request.number;
            const baseSha = context.payload.pull_request.base.sha;
            const headSha = context.payload.pull_request.head.sha;
            const { data: run } = await github.rest.actions.getWorkflowRun({
              ...repo, run_id: context.runId,
            });
            const start = Date.parse(run.run_started_at);
            const comments = await github.paginate(github.rest.issues.listComments, {
              ...repo, issue_number: pullNumber, per_page: 100,
            });
            // Mark a previous head's targeted results outdated even when this
            // revision needs no follow-up. Otherwise old findings look current.
            const marker = "<!-- mde-pr-agent-targeted-recovery:v1 -->";
            const previousRecovery = comments.find((comment) =>
              comment.user?.login === "github-actions[bot]" &&
              (comment.body ?? "").startsWith(marker));
            if (previousRecovery &&
                !(previousRecovery.body ?? "").includes("**Base/head:** " + baseSha + " / " + headSha)) {
              await github.rest.issues.updateComment({
                ...repo, comment_id: previousRecovery.id,
                body: marker + "\n## Targeted PR-Agent follow-up — OUTDATED\n\n" +
                  "The PR base/head changed. Previous targeted findings do not apply " +
                  "to this revision. The current review remains authoritative.\n",
              });
            }
            const candidates = comments.filter((comment) => {
              if (comment.user?.login !== "github-actions[bot]" ||
                  Date.parse(comment.updated_at) < start) return false;
              const env = parseReviewEnvelope(comment.body ?? "");
              return env.valid && env.baseSha === baseSha && env.headSha === headSha &&
                env.type === "canonical" && env.command === "/review" &&
                env.body.includes("<!-- pr-agent:review:full -->");
            }).sort((a, b) => Date.parse(b.updated_at) - Date.parse(a.updated_at));
            if (!candidates.length) return;
            let plan;
            try {
              plan = await prepareRecoveryFromGithub({ github, ...repo, pullNumber,
                baseSha, headSha, reviewBody: candidates[0].body });
            } catch (error) {
              core.warning("Bounded recovery unavailable: " + String(error.message).slice(0, 180));
              return;
            }
            if (!plan.ok) {
              core.info("No safe bounded recovery: " + plan.reason);
              return;
            }
            // Reuse only a GitHub Actions bot's earlier validated, exact-source
            // model output. A plain model-claimed "complete" heading is NEVER
            // sufficient. On retries, re-derive the immutable source patch and
            // re-validate every path, line and omission before avoiding a call.
            const profile = "v0.49.0-nvidia-lightning-target-v1";
            const cacheHeader = (previousRecovery?.body ?? "").startsWith(
              marker + "\n## Verified bounded follow-up\n");
            // Never parse the untrusted model-generated findings section as
            // cache metadata. Only the fixed, bot-authored prefix may contain it.
            const trustedPrefix = cacheHeader ? previousRecovery.body.split(
              "\n**Model findings withheld without changed-line proof:**")[0] : "";
            const encoded = trustedPrefix.match(
              /<!-- mde-pr-agent-model-cache:v1:([A-Za-z0-9_-]{20,50000}) -->/
            )?.[1];
            if (encoded) {
              try {
                const { gunzipSync } = require("node:zlib");
                const cached = JSON.parse(gunzipSync(
                  Buffer.from(encoded, "base64url"), { maxOutputLength: 65536 }
                ).toString("utf8"));
                if (cached.v === 1 && cached.profile === profile &&
                    cached.baseSha === baseSha && cached.headSha === headSha &&
                    cached.path === plan.path && cached.diffSha256 === plan.diffSha256 &&
                    cached.patchBytes === plan.patchBytes) {
                  const { validateTargetedModelOutput } = await import(pathToFileURL(source).href);
                  const checked = validateTargetedModelOutput({
                    output: cached.output, diff: plan.diff, path: plan.path,
                  });
                  if (checked.ok && checked.coverageComplete) {
                    fs.mkdirSync(".pr-agent", { recursive: true });
                    fs.writeFileSync(".pr-agent/recovery.diff", plan.diff, "utf8");
                    delete plan.diff;
                    fs.writeFileSync(".pr-agent/recovery-plan.json", JSON.stringify(plan), "utf8");
                    fs.writeFileSync(".pr-agent/recovery.json", JSON.stringify(cached.output), "utf8");
                    core.setOutput("ready", "true");
                    core.setOutput("cached", "true");
                    core.info("Revalidated trusted exact-head model output; no duplicate AI call.");
                    return;
                  }
                }
              } catch (error) {
                core.warning("Prior recovery cache could not be verified; evaluating fresh source.");
              }
            }
            fs.mkdirSync(".pr-agent", { recursive: true });
            fs.writeFileSync(".pr-agent/recovery.diff", plan.diff, "utf8");
            delete plan.diff;
            fs.writeFileSync(".pr-agent/recovery-plan.json", JSON.stringify(plan), "utf8");
            core.setOutput("ready", "true");
            core.info("Prepared one exact-source patch for bounded PR-Agent review: " + plan.path);

      - name: Re-review missing patch with pinned PR-Agent v0.49.0
        id: recovery-model
        if: steps.recovery-plan.outputs.ready == 'true' && steps.recovery-plan.outputs.cached != 'true'
        shell: bash
        env:
          OPENAI_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          OPENAI_API_BASE: https://integrate.api.nvidia.com/v1
        run: |
          set -euo pipefail
          image='pragent/pr-agent@sha256:b1ed6e8de56eb4d6e4169ee0d5c209bb5ed1ef071a01c0c042c64b80192a785c'
          # Mount only the generated patch, never a PR-head checkout or GitHub token.
          if docker run --rm \
              -v "$PWD/.pr-agent:/review:rw" -w /review \
              -e OPENAI_API_KEY -e OPENAI_API_BASE \
              -e 'config.model=openai/nvidia/nemotron-3.5-lightning-30b-a3b' \
              -e 'config.fallback_models=["openai/nvidia/nemotron-3.5-super-vl-120b-a12b"]' \
              -e 'config.max_model_tokens=40000' \
              -e 'config.custom_model_max_tokens=40000' \
              -e 'config.max_output_tokens=8192' \
              -e 'config.ai_timeout=180' \
              -e 'config.num_retries=0' \
              -e 'litellm.extra_body={"chat_template_kwargs":{"enable_thinking":false}}' \
              -e 'litellm.disable_aiohttp=true' \
              --entrypoint python "$image" \
              -m pr_agent.cli --diff-file /review/recovery.diff \
              --json-output /review/recovery.json --output /review/recovery.md review; then
            if [[ -s .pr-agent/recovery.json && -s .pr-agent/recovery.md ]]; then
              echo 'completed=true' >> "$GITHUB_OUTPUT"
            fi
          else
            echo '::warning::Targeted AI review failed; original strict incomplete review remains red.'
          fi


      - name: Require a fresh base-aware PR-Agent review result
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          REVIEW_COMMAND: ${{ needs.review.outputs.review_command }}
        with:
          github-token: ${{ github.token }}
          script: |
            const { pathToFileURL } = require("url");
            const fs = require("fs");
            const policyPath = `${process.env.GITHUB_WORKSPACE}/scripts/pr-agent/review-policy.mjs`;
            const policy = await import(pathToFileURL(policyPath).href);
            const { verifyReviewResult, appendCertification, CERT_HISTORY_MARKER } = policy;
            if (!CERT_HISTORY_MARKER) {
              core.setFailed("caller review policy must export CERT_HISTORY_MARKER");
              return;
            }
            const { data: run } = await github.rest.actions.getWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.runId,
            });
            const startedAt = new Date(run.run_started_at).getTime();
            const maxAttempts = 3;
            let comments = [];
            let result = { ok: false };
            for (let attempt = 1; attempt <= maxAttempts && !result.ok; attempt += 1) {
              comments = await github.paginate(github.rest.issues.listComments, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                per_page: 100,
              });
              result = verifyReviewResult({
                comments,
                startedAt,
                reviewCommand: process.env.REVIEW_COMMAND || "/review",
                baseSha: context.payload.pull_request.base.sha,
                headSha: context.payload.pull_request.head.sha,
              });
              if (!result.ok && result.code === "NO_REVIEW" && attempt < maxAttempts) {
                core.info(`PR-Agent review not visible yet; retrying (${attempt}/${maxAttempts})`);
                await new Promise((resolve) => setTimeout(resolve, 5000));
                continue;
              }
              if (!result.ok && result.code !== "NO_REVIEW") break;
            }
            // SAN-1640: only recover a named budget-excluded high-risk source
            // file. Never weaken the original canonical verifier on its own.
            let recovered = null;
            if (!result.ok && result.code === "INCOMPLETE_REVIEW" &&
                fs.existsSync(".pr-agent/recovery-plan.json") &&
                fs.existsSync(".pr-agent/recovery.diff") &&
                fs.existsSync(".pr-agent/recovery.json")) {
              try {
                const { prepareRecoveryFromGithub, verifyRecoveredCoverage } =
                  await import(pathToFileURL(process.env.GITHUB_WORKSPACE +
                    "/scripts/pr-agent/prepare-recovery.mjs").href);
                const repo = { owner: context.repo.owner, repo: context.repo.repo };
                const baseSha = context.payload.pull_request.base.sha;
                const headSha = context.payload.pull_request.head.sha;
                const original = comments.filter((comment) => {
                  if (comment.user?.login !== "github-actions[bot]" ||
                      Date.parse(comment.updated_at) < startedAt) return false;
                  const env = policy.parseReviewEnvelope(comment.body ?? "");
                  return env.valid && env.baseSha === baseSha && env.headSha === headSha &&
                    env.command === "/review" && env.type === "canonical" &&
                    env.body.includes("<!-- pr-agent:review:full -->");
                }).sort((a, b) => Date.parse(b.updated_at) - Date.parse(a.updated_at))[0];
                if (!original) throw new Error("No trusted canonical partial review");
                const storedPlan = JSON.parse(fs.readFileSync(".pr-agent/recovery-plan.json", "utf8"));
                const diff = fs.readFileSync(".pr-agent/recovery.diff", "utf8");
                const output = JSON.parse(fs.readFileSync(".pr-agent/recovery.json", "utf8"));
                // Re-derive the full patch from exact GitHub refs to reject
                // mutable workspace artifacts before accepting any AI output.
                const fresh = await prepareRecoveryFromGithub({
                  github, ...repo, pullNumber: context.issue.number,
                  baseSha, headSha, reviewBody: original.body,
                });
                if (!fresh.ok || fresh.diffSha256 !== storedPlan.diffSha256 ||
                    fresh.diff !== diff || fresh.path !== storedPlan.path) {
                  throw new Error("Live exact-blob diff no longer matches supplied proof");
                }
                const { data: pr } = await github.rest.pulls.get({
                  ...repo, pull_number: context.issue.number,
                });
                const files = await github.paginate(github.rest.pulls.listFiles, {
                  ...repo, pull_number: context.issue.number, per_page: 100,
                });
                const verified = verifyRecoveredCoverage({
                  reviewBody: original.body, baseSha, headSha, files,
                  expectedCount: pr.changed_files, plan: storedPlan, diff, output,
                });
                if (!verified.ok) throw new Error(verified.reason);
                recovered = verified;
                // This attests to validated review INPUT and model-reported
                // omissions, never to semantic understanding of every hunk.
                result = { ok: true, code: "SOURCE_BOUND_MODEL_RECOVERY",
                  coverageConfirmed: true, comment: original,
                  reason: "Exact-source targeted model review validated for: " +
                    verified.path };
                core.notice("Targeted coverage recovered for " + verified.path);
              } catch (error) {
                core.warning("Bounded recovery unverified; original strict check remains red: " +
                  String(error.message).slice(0, 240));
              }
            }
            if (!result.ok) {
              const code = result.code === "NO_REVIEW" ? "REVIEW_TIMEOUT" : (result.code || "INVALID_ENVELOPE");
              core.setFailed(`PR-Agent verification failed [${code}]: ${result.reason || "unknown review verification failure"}`);
              return;
            }
            // Certification is for this exact current PR revision only.
            const { data: currentPr } = await github.rest.pulls.get({
              owner: context.repo.owner, repo: context.repo.repo,
              pull_number: context.issue.number,
            });
            if (currentPr.base.sha !== context.payload.pull_request.base.sha ||
                currentPr.head.sha !== context.payload.pull_request.head.sha) {
              core.setFailed("STALE_PR_REVISION: refusing obsolete recovery certificate");
              return;
            }
            const existing = comments.find((comment) =>
              comment.user?.login === "github-actions[bot]" &&
              (comment.body ?? "").includes(CERT_HISTORY_MARKER));
            const body = appendCertification(existing?.body ?? "", {
              baseSha: context.payload.pull_request.base.sha,
              headSha: context.payload.pull_request.head.sha,
            });
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

            if (recovered) {
              // Upsert one supplemental comment without letting model prose
              // rewrite the required strict verifier result or prior findings.
              const marker = "<!-- mde-pr-agent-targeted-recovery:v1 -->";
              const findings = recovered.findings.map((finding) =>
                "### " + finding.title + "\n**Changed lines:** " +
                finding.startLine + "–" + finding.endLine + "\n\n" + finding.detail)
                .join("\n\n").slice(0, 14000);
              const { gzipSync } = require("node:zlib");
              const profile = "v0.49.0-nvidia-lightning-target-v1";
              const cacheRecord = { v: 1, profile,
                baseSha: context.payload.pull_request.base.sha,
                headSha: context.payload.pull_request.head.sha,
                diffSha256: recovered.diffSha256,
                patchBytes: JSON.parse(fs.readFileSync(
                  ".pr-agent/recovery-plan.json", "utf8")).patchBytes,
                path: recovered.path,
                output: {
                  review: JSON.parse(fs.readFileSync(
                    ".pr-agent/recovery.json", "utf8")).review,
                  coverage: JSON.parse(fs.readFileSync(
                    ".pr-agent/recovery.json", "utf8")).coverage,
                },
              };
              const encodedCache = gzipSync(Buffer.from(JSON.stringify(cacheRecord)))
                .toString("base64url");
              // An oversized GitHub comment must not turn successful review
              // verification into a publication error. In that rare case,
              // omit the cache and keep the review evidence truthful.
              const cacheLine = encodedCache.length <= 50000 ?
                "<!-- mde-pr-agent-model-cache:v1:" + encodedCache + " -->\n" : "";
              const recoveryBody = marker + "\n## Verified bounded follow-up\n\n" +
                "**File:** " + recovered.path + "\n" +
                "**Base/head:** " + context.payload.pull_request.base.sha + " / " +
                  context.payload.pull_request.head.sha + "\n" +
                "**Diff SHA-256:** " + recovered.diffSha256 + "\n" +
                "**Reviewer profile:** " + profile + "\n" +
                "**Model coverage:** no omissions reported for this targeted patch\n" +
                (cacheLine && encodedCache.length + findings.length < 57000 ? cacheLine : "") +
                "**Model findings withheld without changed-line proof:** " +
                  recovered.rejectedFindings + "\n" +
                "**Additional grounded findings beyond display cap:** " +
                  (recovered.truncatedFindings ?? 0) + "\n\n" +
                (findings || "No actionable changed-line findings.");
              const previous = comments.find((comment) =>
                comment.user?.login === "github-actions[bot]" &&
                (comment.body ?? "").startsWith(marker));
              if (previous) {
                if (previous.body !== recoveryBody) {
                  await github.rest.issues.updateComment({
                    owner: context.repo.owner, repo: context.repo.repo,
                    comment_id: previous.id, body: recoveryBody,
                  });
                }
              } else {
                await github.rest.issues.createComment({
                  owner: context.repo.owner, repo: context.repo.repo,
                  issue_number: context.issue.number, body: recoveryBody,
                });
              }
            }

            // SAN-1552 · Publish one copy-ready "Prompt for AI Agents" for this exact head.
            // The renderer is imported from the trusted base checkout — never from the PR head —
            // and that same module performs the single upsert, so this job stays the only publisher.
            const rendererPath = `${process.env.GITHUB_WORKSPACE}/scripts/pr-agent/render-fix-prompt.mjs`;
            const commentPath = `${process.env.GITHUB_WORKSPACE}/scripts/pr-agent/fix-prompt-comment.mjs`;
            if (!fs.existsSync(rendererPath) || !fs.existsSync(commentPath)) {
              core.info("fix-prompt modules are absent from the trusted base checkout; skipping publication");
              return;
            }
            const renderer = await import(pathToFileURL(rendererPath).href);
            const commentApi = await import(pathToFileURL(commentPath).href);
            // A push or base update can race the publication step. Do not ground findings in the
            // live diff unless it still belongs to this exact verified base/head pair.
            const { data: livePr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
            });
            if (
              livePr.head.sha !== context.payload.pull_request.head.sha ||
              livePr.base.sha !== context.payload.pull_request.base.sha
            ) {
              core.setFailed("STALE_PR_REVISION: PR head/base changed after review; refusing to publish an obsolete fix prompt");
              return;
            }
            const changedFiles = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
              per_page: 100,
            });
            const rendered = renderer.renderFixPrompt({
              result,
              baseSha: context.payload.pull_request.base.sha,
              headSha: context.payload.pull_request.head.sha,
              prUrl: context.payload.pull_request.html_url,
              changedFiles,
            });
            const published = await commentApi.upsertFixPromptComment({
              github,
              owner: context.repo.owner,
              repo: context.repo.repo,
              issueNumber: context.issue.number,
              body: rendered.body,
            });
            core.info(
              `fix prompt status=${rendered.status} code=${rendered.code} action=${published.action} ` +
                `comment=${published.commentId} confirmed=${rendered.confirmed} ` +
                `investigate=${rendered.investigate} omitted=${rendered.omitted} duplicates=${published.duplicates}`,
            );

  # SAN-1552 · When a review or its verification fails, a previously published prompt for an older
  # head must stop looking current. This job only retires it; it never publishes findings and never
  # turns a failed review into a success, so the required checks keep their existing semantics.
  retire-stale-fix-prompt:
    name: retire-stale-fix-prompt
    needs: [review, verify-review-result]
    if: >-
      always() && (
        (needs.review.result != 'success' && needs.review.result != 'skipped') ||
        needs.verify-review-result.result == 'failure'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout trusted caller verification policy
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false

      - name: Replace an outdated fix prompt with a truthful notice
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ github.token }}
          script: |
            const fs = require("fs");
            const { pathToFileURL } = require("url");
            const rendererPath = `${process.env.GITHUB_WORKSPACE}/scripts/pr-agent/render-fix-prompt.mjs`;
            const commentPath = `${process.env.GITHUB_WORKSPACE}/scripts/pr-agent/fix-prompt-comment.mjs`;
            if (!fs.existsSync(rendererPath) || !fs.existsSync(commentPath)) {
              core.info("fix-prompt modules are absent from the trusted base checkout; nothing to retire");
              return;
            }
            const renderer = await import(pathToFileURL(rendererPath).href);
            const commentApi = await import(pathToFileURL(commentPath).href);
            // A failed old run must not retire the prompt created by a newer PR revision.
            const { data: livePr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
            });
            if (
              livePr.head.sha !== context.payload.pull_request.head.sha ||
              livePr.base.sha !== context.payload.pull_request.base.sha
            ) {
              core.info("superseded review: skipping fix-prompt retirement for an older PR head/base");
              return;
            }
            const headSha = context.payload.pull_request.head.sha;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const owned = comments
              .filter(
                (comment) =>
                  comment.user?.login === "github-actions[bot]" &&
                  String(comment.body ?? "").includes(commentApi.FIX_PROMPT_MARKER),
              )
              .sort((left, right) => new Date(right.updated_at).getTime() - new Date(left.updated_at).getTime());
            if (owned.length === 0) {
              core.info("no fix-prompt comment exists for this pull request; nothing to retire");
              return;
            }
            if (commentApi.publishedHeadOf(owned[0].body ?? "") === headSha) {
              core.info("the fix prompt already records the current head; leaving it current");
              return;
            }
            const stale = renderer.renderOutdatedFixPrompt({
              headSha,
              code: "REVIEW_NOT_CURRENT",
              reason: "the PR-Agent review for this head did not complete, so no current findings exist",
            });
            const retired = await commentApi.upsertFixPromptComment({
              github,
              owner: context.repo.owner,
              repo: context.repo.repo,
              issueNumber: context.issue.number,
              body: stale.body,
            });
            core.info(`retired outdated fix prompt: action=${retired.action} comment=${retired.commentId}`);
