name: Shared reviewer contract tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  shared-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Validate recovery and verification contracts
        run: node --test tests/recovery-workflow.test.mjs
